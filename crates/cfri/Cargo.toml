[package]
name = "cfri"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes = "0.8"
ark-ff = "0.4"
ark-poly = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
ark-std = "0.4"
bincode = "1.3"
bitvec = "1"
blake2 = "0.10"
blake2b_simd = "1"
blake3 = "1.3"
crossbeam = "0.8"
ctr = { git = "https://github.com/RustCrypto/block-modes", rev = "78fefba5a80f3d788fd8ba7c4483625148f5dc18" }
digest = "0.9"
ff = { version = "0.13", features = ["derive"] }
generic-array = { version = "0.14", features = ["serde"] }
halo2_curves = { git = "https://github.com/privacy-scaling-explorations/halo2curves", tag = "v0.4.0", package = "halo2curves", features = ["derive_serde"] }
hex-literal = "0.4"
itertools = "0.13"
lazy_static = "1"
log = "0.4"
merlin = "3.0"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
pasta_curves = { version = "0.5", features = ["serde"] }
poseidon = { git = "https://github.com/han0110/poseidon", branch = "feature/with-spec" }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rayon = "1"
rs_merkle = "1.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.9"
sha3 = "0.10"
subtle = "2"
threadpool = "1"

[features]
default = ["sanity-check"]
benchmark = ["parallel"]
parallel = ["ark-ff/parallel", "ark-poly/parallel"]
sanity-check = []
upstream-tests = []

[dev-dependencies]
ark-test-curves = { version = "0.4", features = ["bls12_381_curve"] }
hex = "0.4"
