[package]
name = "cfri"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ark-ff = "0.4"
ark-poly = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
ark-std = "0.4"
blake3 = "1.3"
digest = "0.9"
lazy_static = "1"
log = "0.4"
merlin = "3.0"
rand = "0.8"
rayon = "1"
rs_merkle = "1.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.9"

[features]
parallel = ["ark-ff/parallel", "ark-poly/parallel"]

[dev-dependencies]
ark-test-curves = { version = "0.4", features = ["bls12_381_curve"] }
hex = "0.4"
